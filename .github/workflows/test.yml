# Runs the unit tests on every pull request and every push to main.
# The Build workflow also calls it, so a release never ships with failing tests.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# A new push to the same pull request cancels the run that is still going for the old one.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RACK_SDK_VERSION: 2.6.6 # Keep in sync with build.yml and shell.nix.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq libjansson-dev pkg-config libgl-dev
      - name: Get the Rack SDK
        run: |
          curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-lin-x64.zip" -o sdk.zip
          unzip -q sdk.zip -d ..
      - name: Run the tests
        run: make -j"$(nproc)" test RACK_DIR=../Rack-SDK
