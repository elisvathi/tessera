# Builds Tessera for Linux, Windows and both Macs, and runs the tests.
# It runs by hand (Actions tab → Build → Run workflow) or on a version tag like v2.0.0, not on every push:
# Mac minutes count ten times against a private repo's free minutes. The tests alone run on every pull request
# (test.yml).
# A tag also makes a GitHub Release with the four .vcvplugin files. The tag must match the version in plugin.json.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  test:
    uses: ./.github/workflows/test.yml

  linux:
    runs-on: ubuntu-latest
    # An older Ubuntu, so the plugin also loads on Linux systems with an older C library.
    container: ubuntu:20.04
    steps:
      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y build-essential git curl unzip jq zstd libgl-dev
      - uses: actions/checkout@v4
      - name: Get the Rack SDK
        run: |
          curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-lin-x64.zip" -o sdk.zip
          unzip -q sdk.zip -d ..
      - name: Build
        run: make -j"$(nproc)" dist RACK_DIR=../Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: lin-x64
          path: dist/*.vcvplugin

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make tar zip unzip zstd curl jq mingw-w64-x86_64-gcc
      - uses: actions/checkout@v4
      - name: Get the Rack SDK
        run: |
          curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-win-x64.zip" -o sdk.zip
          unzip -q sdk.zip -d ..
      - name: Build
        run: make -j"$(nproc)" dist RACK_DIR=../Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/*.vcvplugin

  mac:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - { arch: x64, target: x86_64-apple-darwin }
          - { arch: arm64, target: arm64-apple-darwin }
    steps:
      - name: Install tools
        run: brew list jq zstd >/dev/null 2>&1 || brew install jq zstd
      - uses: actions/checkout@v4
      - name: Get the Rack SDK
        run: |
          curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-mac-${{ matrix.arch }}.zip" -o sdk.zip
          unzip -q sdk.zip -d ..
      # The runner is an Apple Silicon Mac; CROSS_COMPILE picks the target, so both builds work on it.
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" dist RACK_DIR=../Rack-SDK CROSS_COMPILE=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.vcvplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches plugin.json
        run: |
          version=$(jq -r .version plugin.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in plugin.json"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vcvplugin --title "$GITHUB_REF_NAME" --generate-notes
